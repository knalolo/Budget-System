<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Procurement Notification</title>
</head>
<body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#202124;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border:1px solid #dfe3e8;">
          <tr>
            <td style="padding:18px 28px;background:#17365d;color:#ffffff;font-size:19px;font-weight:bold;">Procurement System</td>
          </tr>
          <tr>
            <td style="padding:28px;font-size:14px;line-height:1.55;">
              <p style="margin:0 0 16px;">Dear {{ greeting }},</p>
              <p style="margin:0 0 20px;">{{ message }}</p>
              <table role="presentation" width="100%" cellpadding="7" cellspacing="0" style="border-collapse:collapse;border:1px solid #dfe3e8;">
                {% for label, value in fields %}
                <tr>
                  <td width="38%" style="border-bottom:1px solid #e8eaed;background:#f7f8fa;color:#5f6368;">{{ label }}</td>
                  <td style="border-bottom:1px solid #e8eaed;font-weight:600;">{{ value }}</td>
                </tr>
                {% endfor %}
              </table>
              {% if note %}
              <p style="margin:20px 0 0;padding:12px;border-left:4px solid #c5221f;background:#fce8e6;font-weight:bold;">{{ note }}</p>
              {% endif %}
              <p style="margin:20px 0 0;"><strong>Next Step:</strong> {{ next_step }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:14px 28px;border-top:1px solid #dfe3e8;background:#f7f8fa;color:#777;font-size:12px;">
              This is an automated notification from the Procurement System. Please do not reply.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
